apis:
- aid: npp-australia:npp-api-framework
  name: NPP API Framework
  description: >-
    The NPP API Framework defines the mandatory technical approach and data
    attributes for APIs built on the New Payments Platform, aligned to the ISO
    20022 messaging standard. NPP Australia does not itself operate a consumable
    API; the framework governs how NPP Participants expose and integrate real-time
    payment capabilities. Published as a versioned specification document (v5.0),
    not a self-serve REST API with a public base URL.
  humanURL: https://www.auspayplus.com.au/solutions/npp-for-developers
  tags:
  - ISO 20022
  - Real-Time Payments
  - Framework
  properties:
  - type: Documentation
    url: https://www.auspayplus.com.au/solutions/npp-for-developers
  - type: APIReference
    url: https://www.auspayplus.com.au/wp-content/uploads/2024/06/NPP-API-Framework-v5.0.pdf
  - type: Sandbox
    url: https://nppa-developer.swift.com/user/register
- aid: npp-australia:payto
  name: PayTo
  description: >-
    PayTo is NPP's real-time, digital mandated-debit overlay service. It lets
    businesses initiate real-time payments from a customer's bank account under a
    pre-authorised agreement, giving consumers visibility and control over
    recurring and one-off debits. Delivered through NPP Participants using
    ISO 20022 messaging and the PayTo messaging toolkit; NPP Australia publishes
    the service documentation and toolkit rather than a self-serve public API.
  humanURL: https://www.auspayplus.com.au/solutions/payto
  tags:
  - PayTo
  - Mandated Debit
  - Real-Time Payments
  properties:
  - type: Documentation
    url: https://www.auspayplus.com.au/solutions/payto
- aid: npp-australia:payid
  name: PayID
  description: >-
    PayID is NPP's addressing service, allowing payments to be directed using a
    simple identifier such as a mobile number, email address, ABN or organisation
    ID instead of a BSB and account number. It is implemented by NPP Participants
    over the New Payments Platform; NPP Australia publishes the PayID service
    documentation and messaging toolkit rather than a consumable public API.
  humanURL: https://www.auspayplus.com.au/solutions/payid
  tags:
  - PayID
  - Addressing
  - Real-Time Payments
  properties:
  - type: Documentation
    url: https://www.auspayplus.com.au/solutions/payid
