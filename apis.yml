name: NPP Australia (AP+)
kind: company
description: >-
  NPP Australia is the operator of the New Payments Platform (NPP), Australia's
  national real-time, data-rich, account-to-account payments infrastructure that
  settles 24 hours a day, 365 days a year across more than 100 connected banks,
  credit unions, fintechs and government agencies. Since 2021 NPP Australia has
  been a wholly owned subsidiary of Australian Payments Plus (AP+), the entity
  formed by amalgamating NPP Australia, BPAY Group and eftpos. On top of the core
  clearing-and-settlement rail, NPP operates two overlay services: PayID, an
  addressing service that maps a mobile number, email, ABN or organisation ID to
  a bank account, and PayTo, a real-time mandated-debit capability that gives
  consumers visibility and control over recurring and one-off account debits.
  Its home market is Australia, and it sits alongside the Consumer Data Right as
  the country's payments spine. Its API posture is that of a scheme and rail
  operator rather than a self-serve PSP: NPP Australia itself does not sell a
  public API, but it publishes the ISO 20022-aligned NPP API Framework that
  defines the mandatory technical approach and data attributes NPP Participants
  implement, and AP+ runs a (registration-gated) developer portal plus a
  SWIFT-hosted API sandbox. The consumable APIs are offered by NPP Participants,
  not by NPP Australia.
